<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>iPAS AI 應用規劃師（初級）學習字典</title>
<style>
:root{--purple:#4A2E80;--ink:#202124;--muted:#667085;--paper:#fff;--bg:#eeeaf5;--line:#ded8ea;--accent:#4A2E80}
*{box-sizing:border-box} html,body{height:100%;margin:0}
body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 10%,#fff 0,#f7f5fb 28%,#e8e3f0 100%);overflow:hidden}
button,input{font:inherit}.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 24px;background:#ffffffdd;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:5}
.brand{font-weight:900;color:var(--purple);white-space:nowrap}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.08em}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:min(380px,38vw);background:#f5f3f8;border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.search input{width:100%;border:0;outline:0;background:transparent;font-size:16px}.icon-btn{border:1px solid var(--line);background:white;border-radius:12px;padding:9px 13px;cursor:pointer;font-weight:800;color:var(--purple)}
.stage{position:relative;min-height:0;display:grid;place-items:center;padding:22px 88px}
.book{width:min(1240px,100%);height:min(700px,calc(100dvh - 150px));display:grid;grid-template-columns:1fr 1fr;perspective:1800px;transform-style:preserve-3d;backface-visibility:hidden;filter:drop-shadow(0 24px 30px #38285b2b)}
.page{position:relative;background:var(--paper);padding:40px 46px 34px;overflow:hidden;border:1px solid var(--line)}
.left{border-radius:22px 0 0 22px;background:linear-gradient(135deg,#fff 0,#fbfaff 65%,#f0ebf8 100%);border-right:0}
.right{border-radius:0 22px 22px 0;box-shadow:inset 18px 0 25px -28px #2f2448}
.left:after{content:"";position:absolute;right:0;top:0;width:1px;height:100%;background:linear-gradient(transparent,#bdb2cd 12%,#bdb2cd 88%,transparent)}
.kicker{font-size:14px;letter-spacing:.14em;font-weight:900;color:var(--accent);text-transform:uppercase}.term-no{position:absolute;top:35px;right:42px;color:#a198ae;font-weight:800}
h1{font-size:clamp(34px,4vw,60px);line-height:1.13;margin:46px 0 16px;color:var(--accent)}.english{font-size:clamp(21px,2vw,30px);font-weight:800;line-height:1.3}.abbr{display:inline-block;margin-top:18px;border-radius:999px;padding:8px 17px;background:var(--accent);color:white;font-size:22px;font-weight:900}
.topic-note{position:absolute;left:46px;right:46px;bottom:30px;padding:10px 14px;border-radius:12px;background:#f4f0fa;border:1px solid var(--line);color:var(--muted);font-size:18px;line-height:1.3;font-weight:700}.topic-note b{color:var(--accent)}
.block{margin-bottom:20px}.label{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:900;color:var(--accent);margin-bottom:7px}.label:before{content:"";width:7px;height:23px;border-radius:8px;background:var(--accent)}
.content{font-size:clamp(18px,1.48vw,23px);line-height:1.52;margin:0}.plain,.exam{padding:13px 17px;border-radius:14px;background:#f7f5fb;border-left:5px solid var(--accent)}.exam{background:#fff8e7;border-left-color:#F39C12}
.book.compact .page{padding-top:30px;padding-bottom:26px}.book.compact .block{margin-bottom:13px}.book.compact .content{font-size:clamp(17px,1.32vw,21px);line-height:1.38}.book.compact .plain,.book.compact .exam{padding:10px 14px}.book.compact h1{margin-top:38px}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:56px;height:76px;border:0;border-radius:18px;background:#ffffffdf;color:var(--purple);font-size:38px;line-height:1;cursor:pointer;box-shadow:0 10px 30px #33264b25}.nav:hover{background:white;transform:translateY(-50%) scale(1.04)}.prev{left:18px}.next{right:18px}.nav:disabled{opacity:.25;cursor:not-allowed}
.footer{display:flex;justify-content:center;align-items:center;gap:18px;padding:9px 20px 13px;color:var(--muted)}.progress{width:min(500px,44vw);height:6px;background:#d9d2e4;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}.page-count{min-width:100px;text-align:center;font-weight:800}
.drawer{position:fixed;z-index:10;inset:0 auto 0 0;width:min(430px,90vw);background:white;box-shadow:15px 0 45px #241a3545;transform:translateX(-105%);transition:.25s;display:grid;grid-template-rows:auto auto 1fr}.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line)}.drawer h2{margin:0;color:var(--purple)}.filters{display:flex;gap:7px;overflow:auto;padding:12px 18px;border-bottom:1px solid var(--line)}.chip{border:1px solid var(--line);background:#faf9fc;border-radius:99px;padding:7px 11px;white-space:nowrap;cursor:pointer}.chip.active{background:var(--purple);color:white}.toc{overflow:auto;padding:8px}.toc button{display:block;width:100%;text-align:left;border:0;background:white;padding:12px 14px;border-radius:10px;cursor:pointer}.toc button:hover,.toc button.active{background:#f0ebf8;color:var(--purple)}.overlay{position:fixed;z-index:9;inset:0;background:#19122266;display:none}.overlay.show{display:block}
.empty{display:grid;place-items:center;text-align:center;height:100%;font-size:24px;color:var(--muted)}
.turning-book{position:absolute!important;z-index:20;pointer-events:none;will-change:transform,filter;transform-style:preserve-3d;backface-visibility:hidden}
@media(prefers-reduced-motion:reduce){.turning-book{display:none!important}}
@media(max-width:760px){.app{height:100dvh;grid-template-rows:auto 1fr auto}.topbar{padding:8px 10px;gap:8px;flex-wrap:wrap}.brand{font-size:14px}.brand small{display:none}.icon-btn{padding:7px 10px}.search{order:3;width:100%;min-width:0;padding:6px 12px}.stage{padding:8px 10px 58px}.book{height:100%;max-height:none;display:grid;grid-template-columns:1fr;grid-template-rows:40% 60%;filter:drop-shadow(0 8px 16px #38285b20)}.page{padding:17px 20px}.left{border-radius:15px 15px 0 0;border-right:1px solid var(--line);border-bottom:0}.right{border-radius:0 0 15px 15px}.left:after{display:none}.kicker{font-size:12px}.term-no{top:16px;right:20px;font-size:13px}h1{font-size:clamp(27px,8vw,39px);margin:19px 0 5px}.english{font-size:clamp(17px,4.8vw,22px)}.abbr{font-size:17px;margin-top:7px;padding:5px 12px}.topic-note{left:20px;right:20px;bottom:13px;padding:6px 9px;font-size:18px}.block{margin-bottom:8px}.label{font-size:15px;margin-bottom:3px}.label:before{height:17px;width:5px}.content,.book.compact .content{font-size:clamp(14px,3.7vw,18px);line-height:1.3}.plain,.exam,.book.compact .plain,.book.compact .exam{padding:6px 10px;border-radius:9px}.book.compact .page{padding:14px 18px}.book.compact h1{margin-top:15px}.nav{position:fixed;z-index:7;top:auto;bottom:12px;width:48px;height:48px;border-radius:50%;font-size:28px}.prev{left:14px}.next{right:14px}.footer{position:fixed;left:69px;right:69px;bottom:10px;background:#ffffffee;border-radius:99px;padding:7px;font-size:13px}.progress,.footer>span:last-child{display:none}.page-count{min-width:0}.drawer{width:min(390px,92vw)}}
@media print{.topbar,.nav,.footer,.drawer,.overlay{display:none!important}.stage{padding:0}.book{display:block;height:auto;filter:none}.page{border:0;border-radius:0;page-break-inside:avoid;min-height:50vh}.left,.right{box-shadow:none}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="icon-btn" id="menu" aria-label="開啟目錄">☰ 目錄</button>
    <div class="brand">iPAS AI 學習字典<small>TERMS AND DEFINITIONS</small></div>
    <label class="search">🔎<input id="search" type="search" placeholder="搜尋中文、英文或縮寫…" autocomplete="off"></label>
    <button class="icon-btn" id="reset" title="清除搜尋">全部</button>
  </header>
  <main class="stage">
    <button class="nav prev" id="prev" aria-label="上一頁">‹</button>

  </main>
  <footer class="footer"><span class="page-count" id="count"></span><span class="progress"><i id="bar"></i></span><span>← → 翻頁</span></footer>
</div>
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head"><h2>術語目錄</h2><button class="icon-btn" id="close">✕</button></div>
  <div class="filters" id="filters"></div><div class="toc" id="toc"></div>
</aside>
<script>
const DATA={"sections":[{"code":"A","name":"人工智慧基礎","color":"#4A2E80"},{"code":"B","name":"資料處理與分析","color":"#2980B9"},{"code":"C","name":"機器學習方法","color":"#27AE60"},{"code":"D","name":"模型訓練與評估","color":"#F39C12"},{"code":"E","name":"深度學習與生成式 AI","color":"#4A2E80"},{"code":"F","name":"提示、檢索與智能體","color":"#2980B9"},{"code":"G","name":"No-code、系統與導入","color":"#27AE60"},{"code":"H","name":"風險、治理與維運","color":"#E74C3C"}],"terms":[{"code":"A","section":"人工智慧基礎","color":"#4A2E80","term":"人工智慧","english":"Artificial Intelligence","abbr":"AI","definition":"讓機器執行通常需要人類智慧的任務，如感知、學習、推理、決策與生成內容。","plain":"不是單一演算法，而是技術與應用的總稱。","exam":"AI 是技術與應用的總稱，不等於單一模型或單一演算法。","number":"A-01"},{"code":"A","section":"人工智慧基礎","color":"#4A2E80","term":"弱人工智慧","english":"Artificial Narrow Intelligence","abbr":"ANI","definition":"針對特定任務設計、能力範圍有限的人工智慧。","plain":"現今多數 AI 都屬 ANI；會下棋不代表會開車。","exam":"現今主流 AI 多屬 ANI；只能在限定任務中表現良好。","number":"A-02"},{"code":"A","section":"人工智慧基礎","color":"#4A2E80","term":"通用人工智慧","english":"Artificial General Intelligence","abbr":"AGI","definition":"假想中能跨領域理解、學習並執行多種人類智慧任務的 AI。","plain":"目前尚未被普遍認定已實現。","exam":"AGI 尚未被普遍認定已實現，題目若稱現有聊天模型已達 AGI，通常錯誤。","number":"A-03"},{"code":"A","section":"人工智慧基礎","color":"#4A2E80","term":"超人工智慧","english":"Artificial Superintelligence","abbr":"ASI","definition":"假想中在幾乎所有認知任務上超越人類的 AI。","plain":"屬未來情境，不等於今日生成式 AI。","exam":"ASI 是假想的未來階段，不是現今生成式 AI 的同義詞。","number":"A-04"},{"code":"A","section":"人工智慧基礎","color":"#4A2E80","term":"圖靈測試","english":"Turing Test","abbr":"","definition":"以人機文字互動判斷機器表現是否難以與人類區分的思想實驗。","plain":"測的是可觀察表現，不等同真正理解。","exam":"判斷的是外在互動表現，不證明機器具意識或真正理解。","number":"A-05"},{"code":"A","section":"人工智慧基礎","color":"#4A2E80","term":"專家系統","english":"Expert System","abbr":"","definition":"以知識庫與規則推論，模擬特定領域專家判斷的系統。","plain":"典型結構：知識庫＋推論引擎。","exam":"記住核心辨識句：「典型結構：知識庫＋推論引擎」。情境題先找題幹中的任務、資料與限制。","number":"A-06"},{"code":"B","section":"資料處理與分析","color":"#2980B9","term":"資料","english":"Data","abbr":"","definition":"可被蒐集、記錄與處理的事實、數值、文字、影像或訊號。","plain":"AI 的輸入品質會直接影響輸出品質。","exam":"記住核心辨識句：「AI 的輸入品質會直接影響輸出品質」。情境題先找題幹中的任務、資料與限制。","number":"B-01"},{"code":"B","section":"資料處理與分析","color":"#2980B9","term":"結構化資料","english":"Structured Data","abbr":"","definition":"依固定欄位與格式組織，容易以表格或資料庫查詢的資料。","plain":"例：Excel 銷售表、客戶資料表。","exam":"記住核心辨識句：「例：Excel 銷售表、客戶資料表」。情境題先找題幹中的任務、資料與限制。","number":"B-02"},{"code":"B","section":"資料處理與分析","color":"#2980B9","term":"非結構化資料","english":"Unstructured Data","abbr":"","definition":"沒有固定表格結構的文字、圖片、音訊與影片等資料。","plain":"通常需先抽取特徵或轉換格式。","exam":"記住核心辨識句：「通常需先抽取特徵或轉換格式」。情境題先找題幹中的任務、資料與限制。","number":"B-03"},{"code":"B","section":"資料處理與分析","color":"#2980B9","term":"特徵","english":"Feature","abbr":"","definition":"提供模型學習與預測的輸入變數或資料屬性。","plain":"例：房價模型的坪數、屋齡、地段。","exam":"記住核心辨識句：「例：房價模型的坪數、屋齡、地段」。情境題先找題幹中的任務、資料與限制。","number":"B-04"},{"code":"B","section":"資料處理與分析","color":"#2980B9","term":"標籤","english":"Label / Target","abbr":"","definition":"監督式學習中希望模型預測的正確答案或目標變數。","plain":"特徵是題目，標籤是答案。","exam":"記住核心辨識句：「特徵是題目，標籤是答案」。情境題先找題幹中的任務、資料與限制。","number":"B-05"},{"code":"B","section":"資料處理與分析","color":"#2980B9","term":"資料品質","english":"Data Quality","abbr":"","definition":"資料在正確性、完整性、一致性、及時性與有效性等面向的程度。","plain":"垃圾進、垃圾出：GIGO。","exam":"記住核心辨識句：「垃圾進、垃圾出：GIGO」。情境題先找題幹中的任務、資料與限制。","number":"B-06"},{"code":"B","section":"資料處理與分析","color":"#2980B9","term":"缺失值","english":"Missing Value","abbr":"","definition":"資料欄位沒有觀測值或以空白、NULL 等形式存在。","plain":"可刪除、補值或建立缺失指標。","exam":"記住核心辨識句：「可刪除、補值或建立缺失指標」。情境題先找題幹中的任務、資料與限制。","number":"B-07"},{"code":"B","section":"資料處理與分析","color":"#2980B9","term":"異常值","english":"Outlier","abbr":"","definition":"明顯偏離多數觀測值的資料點，可能是真實事件或資料錯誤。","plain":"先判斷原因，再決定保留或處理。","exam":"記住核心辨識句：「先判斷原因，再決定保留或處理」。情境題先找題幹中的任務、資料與限制。","number":"B-08"},{"code":"B","section":"資料處理與分析","color":"#2980B9","term":"重複資料","english":"Duplicate Data","abbr":"","definition":"同一筆實體或事件被重複記錄的資料。","plain":"會造成統計偏誤與模型過度重視。","exam":"記住核心辨識句：「會造成統計偏誤與模型過度重視」。情境題先找題幹中的任務、資料與限制。","number":"B-09"},{"code":"B","section":"資料處理與分析","color":"#2980B9","term":"資料清理","english":"Data Cleaning","abbr":"","definition":"偵測並修正缺失、錯誤、重複、不一致或異常資料的過程。","plain":"常是資料前處理最耗時的工作。","exam":"記住核心辨識句：「常是資料前處理最耗時的工作」。情境題先找題幹中的任務、資料與限制。","number":"B-10"},{"code":"B","section":"資料處理與分析","color":"#2980B9","term":"標準化","english":"Standardization","abbr":"","definition":"將數值轉換為平均數約 0、標準差約 1 的尺度。","plain":"常見公式：(x−平均數)／標準差。","exam":"記住核心辨識句：「常見公式：(x−平均數)／標準差」。情境題先找題幹中的任務、資料與限制。","number":"B-11"},{"code":"B","section":"資料處理與分析","color":"#2980B9","term":"正規化","english":"Normalization","abbr":"","definition":"將數值縮放到指定範圍，常見為 0 到 1。","plain":"適合不同單位或量級的特徵。","exam":"記住核心辨識句：「適合不同單位或量級的特徵」。情境題先找題幹中的任務、資料與限制。","number":"B-12"},{"code":"B","section":"資料處理與分析","color":"#2980B9","term":"類別編碼","english":"Categorical Encoding","abbr":"","definition":"把文字類別轉為模型可處理的數值表示。","plain":"常見：Label Encoding、One-hot Encoding。","exam":"記住核心辨識句：「常見：Label Encoding、One-hot Encoding」。情境題先找題幹中的任務、資料與限制。","number":"B-13"},{"code":"B","section":"資料處理與分析","color":"#2980B9","term":"探索式資料分析","english":"Exploratory Data Analysis","abbr":"EDA","definition":"用統計摘要與視覺化了解資料分布、關係與異常。","plain":"目的在理解資料，不是直接證明因果。","exam":"記住核心辨識句：「目的在理解資料，不是直接證明因果」。情境題先找題幹中的任務、資料與限制。","number":"B-14"},{"code":"B","section":"資料處理與分析","color":"#2980B9","term":"相關","english":"Correlation","abbr":"","definition":"衡量兩個變數共同變動方向與強度的統計關係。","plain":"相關不等於因果。","exam":"相關不等於因果。","number":"B-15"},{"code":"C","section":"機器學習方法","color":"#27AE60","term":"機器學習","english":"Machine Learning","abbr":"ML","definition":"讓系統從資料中學習規律，改善預測或決策表現的方法。","plain":"資料＋演算法＋評估是核心。","exam":"記住核心辨識句：「資料＋演算法＋評估是核心」。情境題先找題幹中的任務、資料與限制。","number":"C-01"},{"code":"C","section":"機器學習方法","color":"#27AE60","term":"監督式學習","english":"Supervised Learning","abbr":"","definition":"以具標籤資料學習輸入與答案之間的映射。","plain":"主要任務：分類、迴歸。","exam":"看到「有標籤、已知答案、分類或迴歸」優先判斷為監督式學習。","number":"C-02"},{"code":"C","section":"機器學習方法","color":"#27AE60","term":"非監督式學習","english":"Unsupervised Learning","abbr":"","definition":"從無標籤資料中尋找群組、結構或低維表示。","plain":"主要任務：分群、降維。","exam":"看到「無標籤、分群、降維、找結構」優先判斷為非監督式學習。","number":"C-03"},{"code":"C","section":"機器學習方法","color":"#27AE60","term":"強化學習","english":"Reinforcement Learning","abbr":"RL","definition":"代理人透過與環境互動，依獎勵與懲罰學習行動策略。","plain":"關鍵詞：狀態、行動、獎勵、策略。","exam":"關鍵詞是代理人、環境、狀態、行動、獎勵與策略。","number":"C-04"},{"code":"C","section":"機器學習方法","color":"#27AE60","term":"分類","english":"Classification","abbr":"","definition":"預測離散類別的監督式學習任務。","plain":"例：垃圾郵件／正常郵件。","exam":"記住核心辨識句：「例：垃圾郵件／正常郵件」。情境題先找題幹中的任務、資料與限制。","number":"C-05"},{"code":"C","section":"機器學習方法","color":"#27AE60","term":"迴歸","english":"Regression","abbr":"","definition":"預測連續數值的監督式學習任務。","plain":"例：預測房價或用電量。","exam":"看到連續數值預測，優先聯想到迴歸任務與 MAE、MSE、RMSE、R²。","number":"C-06"},{"code":"C","section":"機器學習方法","color":"#27AE60","term":"分群","english":"Clustering","abbr":"","definition":"依相似性將無標籤資料分成若干群組。","plain":"例：客群分群；不需先給正確答案。","exam":"記住核心辨識句：「例：客群分群」。情境題先找題幹中的任務、資料與限制。","number":"C-07"},{"code":"C","section":"機器學習方法","color":"#27AE60","term":"降維","english":"Dimensionality Reduction","abbr":"","definition":"以較少變數保留資料主要資訊，降低複雜度。","plain":"常用於視覺化、去噪與加速。","exam":"記住核心辨識句：「常用於視覺化、去噪與加速」。情境題先找題幹中的任務、資料與限制。","number":"C-08"},{"code":"C","section":"機器學習方法","color":"#27AE60","term":"線性迴歸","english":"Linear Regression","abbr":"","definition":"以線性關係估計連續目標值的迴歸方法。","plain":"輸出連續數值。","exam":"看到連續數值預測，優先聯想到迴歸任務與 MAE、MSE、RMSE、R²。","number":"C-09"},{"code":"C","section":"機器學習方法","color":"#27AE60","term":"邏輯迴歸","english":"Logistic Regression","abbr":"","definition":"利用機率函數進行分類，常用於二元分類。","plain":"名稱有迴歸，任務通常是分類。","exam":"名稱雖有「迴歸」，主要用途通常是分類。","number":"C-10"},{"code":"C","section":"機器學習方法","color":"#27AE60","term":"K 近鄰","english":"K-Nearest Neighbors","abbr":"KNN","definition":"以距離最近的 K 個樣本之類別或數值進行預測。","plain":"K 太小易受雜訊影響，太大可能模糊邊界。","exam":"記住核心辨識句：「K 太小易受雜訊影響，太大可能模糊邊界」。情境題先找題幹中的任務、資料與限制。","number":"C-11"},{"code":"C","section":"機器學習方法","color":"#27AE60","term":"支援向量機","english":"Support Vector Machine","abbr":"SVM","definition":"尋找能最大化類別間隔的決策邊界。","plain":"核技巧可處理非線性邊界。","exam":"記住核心辨識句：「核技巧可處理非線性邊界」。情境題先找題幹中的任務、資料與限制。","number":"C-12"},{"code":"C","section":"機器學習方法","color":"#27AE60","term":"決策樹","english":"Decision Tree","abbr":"","definition":"以一連串條件分割資料，形成樹狀預測規則。","plain":"易解釋，但單棵樹容易過擬合。","exam":"記住核心辨識句：「易解釋，但單棵樹容易過擬合」。情境題先找題幹中的任務、資料與限制。","number":"C-13"},{"code":"C","section":"機器學習方法","color":"#27AE60","term":"隨機森林","english":"Random Forest","abbr":"","definition":"整合多棵隨機化決策樹，以投票或平均提升穩定性。","plain":"屬集成學習，通常比單棵樹穩定。","exam":"記住核心辨識句：「屬集成學習，通常比單棵樹穩定」。情境題先找題幹中的任務、資料與限制。","number":"C-14"},{"code":"C","section":"機器學習方法","color":"#27AE60","term":"K-means","english":"K-means Clustering","abbr":"","definition":"反覆指派樣本到最近中心並更新群中心的分群方法。","plain":"需先指定 K；對初始中心與尺度敏感。","exam":"記住核心辨識句：「需先指定 K」。情境題先找題幹中的任務、資料與限制。","number":"C-15"},{"code":"C","section":"機器學習方法","color":"#27AE60","term":"主成分分析","english":"Principal Component Analysis","abbr":"PCA","definition":"把原始變數轉成互相正交、能保留較多變異的新主成分。","plain":"屬降維，不是分類。","exam":"記住核心辨識句：「屬降維，不是分類」。情境題先找題幹中的任務、資料與限制。","number":"C-16"},{"code":"D","section":"模型訓練與評估","color":"#F39C12","term":"訓練集","english":"Training Set","abbr":"","definition":"用來調整模型參數、學習資料規律的資料。","plain":"模型直接從這批資料學習。","exam":"記住核心辨識句：「模型直接從這批資料學習」。情境題先找題幹中的任務、資料與限制。","number":"D-01"},{"code":"D","section":"模型訓練與評估","color":"#F39C12","term":"驗證集","english":"Validation Set","abbr":"","definition":"用於調整超參數、選擇模型與監控過擬合的資料。","plain":"不是最終成績用資料。","exam":"記住核心辨識句：「不是最終成績用資料」。情境題先找題幹中的任務、資料與限制。","number":"D-02"},{"code":"D","section":"模型訓練與評估","color":"#F39C12","term":"測試集","english":"Test Set","abbr":"","definition":"模型定案後，用於估計對未見資料之泛化表現。","plain":"避免反覆查看造成資料洩漏。","exam":"記住核心辨識句：「避免反覆查看造成資料洩漏」。情境題先找題幹中的任務、資料與限制。","number":"D-03"},{"code":"D","section":"模型訓練與評估","color":"#F39C12","term":"過擬合","english":"Overfitting","abbr":"","definition":"模型過度記住訓練資料細節，訓練表現佳但新資料表現差。","plain":"低訓練誤差＋高測試誤差。","exam":"記住核心辨識句：「低訓練誤差＋高測試誤差」。情境題先找題幹中的任務、資料與限制。","number":"D-04"},{"code":"D","section":"模型訓練與評估","color":"#F39C12","term":"欠擬合","english":"Underfitting","abbr":"","definition":"模型過於簡單或訓練不足，連訓練資料也無法良好擬合。","plain":"訓練與測試表現都差。","exam":"記住核心辨識句：「訓練與測試表現都差」。情境題先找題幹中的任務、資料與限制。","number":"D-05"},{"code":"D","section":"模型訓練與評估","color":"#F39C12","term":"交叉驗證","english":"Cross-validation","abbr":"","definition":"把資料輪流切成訓練與驗證部分，多次評估模型穩定性。","plain":"常見 K-fold。","exam":"記住核心辨識句：「常見 K-fold」。情境題先找題幹中的任務、資料與限制。","number":"D-06"},{"code":"D","section":"模型訓練與評估","color":"#F39C12","term":"混淆矩陣","english":"Confusion Matrix","abbr":"","definition":"以 TP、TN、FP、FN 彙整分類預測與實際結果的表格。","plain":"多個分類指標都由此計算。","exam":"先辨認題目要預測的是離散類別，避免與連續數值的迴歸混淆。","number":"D-07"},{"code":"D","section":"模型訓練與評估","color":"#F39C12","term":"準確率","english":"Accuracy","abbr":"","definition":"全部預測中，預測正確所占比例。","plain":"類別不平衡時可能誤導。","exam":"類別不平衡時不能只看 Accuracy。","number":"D-08"},{"code":"D","section":"模型訓練與評估","color":"#F39C12","term":"精確率","english":"Precision","abbr":"","definition":"模型判為正類的樣本中，實際為正類的比例。","plain":"重點：少誤報；TP／(TP＋FP)。","exam":"重視少誤報：TP／(TP＋FP)。","number":"D-09"},{"code":"D","section":"模型訓練與評估","color":"#F39C12","term":"召回率","english":"Recall / Sensitivity","abbr":"","definition":"所有實際正類中，被模型成功找出的比例。","plain":"重點：少漏報；TP／(TP＋FN)。","exam":"重視少漏報：TP／(TP＋FN)。","number":"D-10"},{"code":"D","section":"模型訓練與評估","color":"#F39C12","term":"F1 分數","english":"F1-score","abbr":"","definition":"精確率與召回率的調和平均。","plain":"需同時兼顧誤報與漏報時使用。","exam":"記住核心辨識句：「需同時兼顧誤報與漏報時使用」。情境題先找題幹中的任務、資料與限制。","number":"D-11"},{"code":"D","section":"模型訓練與評估","color":"#F39C12","term":"平均絕對誤差","english":"Mean Absolute Error","abbr":"MAE","definition":"預測值與真實值之絕對誤差的平均。","plain":"單位與目標值相同，直觀易懂。","exam":"記住核心辨識句：「單位與目標值相同，直觀易懂」。情境題先找題幹中的任務、資料與限制。","number":"D-12"},{"code":"D","section":"模型訓練與評估","color":"#F39C12","term":"均方誤差","english":"Mean Squared Error","abbr":"MSE","definition":"預測誤差平方後的平均。","plain":"對大誤差懲罰較重。","exam":"記住核心辨識句：「對大誤差懲罰較重」。情境題先找題幹中的任務、資料與限制。","number":"D-13"},{"code":"D","section":"模型訓練與評估","color":"#F39C12","term":"均方根誤差","english":"Root Mean Squared Error","abbr":"RMSE","definition":"MSE 開平方後的指標。","plain":"單位回到原目標值尺度。","exam":"記住核心辨識句：「單位回到原目標值尺度」。情境題先找題幹中的任務、資料與限制。","number":"D-14"},{"code":"D","section":"模型訓練與評估","color":"#F39C12","term":"決定係數","english":"Coefficient of Determination","abbr":"R²","definition":"衡量迴歸模型解釋目標變異的比例。","plain":"越接近 1 通常越好；可能為負值。","exam":"記住核心辨識句：「越接近 1 通常越好」。情境題先找題幹中的任務、資料與限制。","number":"D-15"},{"code":"E","section":"深度學習與生成式 AI","color":"#4A2E80","term":"深度學習","english":"Deep Learning","abbr":"DL","definition":"以多層神經網路自動學習資料表示的機器學習方法。","plain":"擅長影像、語音、文字等大量資料。","exam":"記住核心辨識句：「擅長影像、語音、文字等大量資料」。情境題先找題幹中的任務、資料與限制。","number":"E-01"},{"code":"E","section":"深度學習與生成式 AI","color":"#4A2E80","term":"人工神經網路","english":"Artificial Neural Network","abbr":"ANN","definition":"由互連節點與權重組成、模擬神經訊號計算的模型。","plain":"基本結構：輸入層、隱藏層、輸出層。","exam":"記住核心辨識句：「基本結構：輸入層、隱藏層、輸出層」。情境題先找題幹中的任務、資料與限制。","number":"E-02"},{"code":"E","section":"深度學習與生成式 AI","color":"#4A2E80","term":"卷積神經網路","english":"Convolutional Neural Network","abbr":"CNN","definition":"以卷積核擷取局部特徵的神經網路。","plain":"常用於影像辨識與電腦視覺。","exam":"記住核心辨識句：「常用於影像辨識與電腦視覺」。情境題先找題幹中的任務、資料與限制。","number":"E-03"},{"code":"E","section":"深度學習與生成式 AI","color":"#4A2E80","term":"循環神經網路","english":"Recurrent Neural Network","abbr":"RNN","definition":"讓先前狀態影響後續輸出的序列模型。","plain":"常見於文字與時間序列；長距依賴較弱。","exam":"記住核心辨識句：「常見於文字與時間序列」。情境題先找題幹中的任務、資料與限制。","number":"E-04"},{"code":"E","section":"深度學習與生成式 AI","color":"#4A2E80","term":"Transformer","english":"Transformer","abbr":"","definition":"以注意力機制處理序列關係、可高度平行運算的架構。","plain":"現代大型語言模型的重要基礎。","exam":"記住核心辨識句：「現代大型語言模型的重要基礎」。情境題先找題幹中的任務、資料與限制。","number":"E-05"},{"code":"E","section":"深度學習與生成式 AI","color":"#4A2E80","term":"注意力機制","english":"Attention Mechanism","abbr":"","definition":"依任務動態分配權重，聚焦輸入中較相關的部分。","plain":"幫助模型建立遠距內容關聯。","exam":"記住核心辨識句：「幫助模型建立遠距內容關聯」。情境題先找題幹中的任務、資料與限制。","number":"E-06"},{"code":"E","section":"深度學習與生成式 AI","color":"#4A2E80","term":"鑑別式 AI","english":"Discriminative AI","abbr":"","definition":"學習類別邊界或條件機率，用於判斷、分類與預測。","plain":"重點是『辨認或預測』。","exam":"先辨認題目要預測的是離散類別，避免與連續數值的迴歸混淆。","number":"E-07"},{"code":"E","section":"深度學習與生成式 AI","color":"#4A2E80","term":"生成式 AI","english":"Generative AI","abbr":"GenAI","definition":"學習資料分布並生成文字、影像、音訊、程式碼等新內容。","plain":"重點是『創造新內容』。","exam":"記住核心辨識句：「重點是『創造新內容』」。情境題先找題幹中的任務、資料與限制。","number":"E-08"},{"code":"E","section":"深度學習與生成式 AI","color":"#4A2E80","term":"基礎模型","english":"Foundation Model","abbr":"","definition":"以大規模廣泛資料預訓練，可適配多種下游任務的模型。","plain":"LLM 是其中一類。","exam":"記住核心辨識句：「LLM 是其中一類」。情境題先找題幹中的任務、資料與限制。","number":"E-09"},{"code":"E","section":"深度學習與生成式 AI","color":"#4A2E80","term":"大型語言模型","english":"Large Language Model","abbr":"LLM","definition":"以大量文字資料訓練，能理解與生成自然語言的模型。","plain":"依上下文預測 token，不保證內容真實。","exam":"記住核心辨識句：「依上下文預測 token，不保證內容真實」。情境題先找題幹中的任務、資料與限制。","number":"E-10"},{"code":"E","section":"深度學習與生成式 AI","color":"#4A2E80","term":"多模態","english":"Multimodal","abbr":"","definition":"能處理或生成文字、影像、音訊等多種資料模態的能力。","plain":"不是只把多個工具放在一起。","exam":"記住核心辨識句：「不是只把多個工具放在一起」。情境題先找題幹中的任務、資料與限制。","number":"E-11"},{"code":"E","section":"深度學習與生成式 AI","color":"#4A2E80","term":"Token","english":"Token","abbr":"","definition":"模型處理文字時的基本切分單位，可能是一個字、詞或詞片段。","plain":"影響上下文容量、速度與費用。","exam":"記住核心辨識句：「影響上下文容量、速度與費用」。情境題先找題幹中的任務、資料與限制。","number":"E-12"},{"code":"E","section":"深度學習與生成式 AI","color":"#4A2E80","term":"上下文視窗","english":"Context Window","abbr":"","definition":"模型一次推論可參考的 token 總範圍。","plain":"通常含系統指令、對話、文件與輸出。","exam":"記住核心辨識句：「通常含系統指令、對話、文件與輸出」。情境題先找題幹中的任務、資料與限制。","number":"E-13"},{"code":"E","section":"深度學習與生成式 AI","color":"#4A2E80","term":"溫度","english":"Temperature","abbr":"","definition":"控制生成時隨機性與多樣性的參數。","plain":"低溫較穩定；高溫較多樣，但非真實度開關。","exam":"Temperature 控制隨機性與多樣性，不是正確率或真實度開關。","number":"E-14"},{"code":"E","section":"深度學習與生成式 AI","color":"#4A2E80","term":"AI 幻覺","english":"AI Hallucination","abbr":"","definition":"模型產生流暢但不正確、無依據或虛構內容的現象。","plain":"需來源引用、人工核驗與風險控制。","exam":"記住核心辨識句：「需來源引用、人工核驗與風險控制」。情境題先找題幹中的任務、資料與限制。","number":"E-15"},{"code":"F","section":"提示、檢索與智能體","color":"#2980B9","term":"提示詞","english":"Prompt","abbr":"","definition":"提供給生成式 AI 的指令、背景、資料與輸出要求。","plain":"好提示常含角色、任務、限制、格式與範例。","exam":"記住核心辨識句：「好提示常含角色、任務、限制、格式與範例」。情境題先找題幹中的任務、資料與限制。","number":"F-01"},{"code":"F","section":"提示、檢索與智能體","color":"#2980B9","term":"零樣本提示","english":"Zero-shot Prompting","abbr":"","definition":"不提供示範範例，只靠指令讓模型完成任務。","plain":"適合簡單或模型熟悉的任務。","exam":"記住核心辨識句：「適合簡單或模型熟悉的任務」。情境題先找題幹中的任務、資料與限制。","number":"F-02"},{"code":"F","section":"提示、檢索與智能體","color":"#2980B9","term":"少樣本提示","english":"Few-shot Prompting","abbr":"","definition":"在提示中提供少量輸入輸出範例，讓模型模仿模式。","plain":"能校準格式、語氣與分類邏輯。","exam":"記住核心辨識句：「能校準格式、語氣與分類邏輯」。情境題先找題幹中的任務、資料與限制。","number":"F-03"},{"code":"F","section":"提示、檢索與智能體","color":"#2980B9","term":"思維鏈提示","english":"Chain-of-Thought Prompting","abbr":"CoT","definition":"引導模型進行分步推理的提示方法。","plain":"適合複雜推理；仍需驗證結論。","exam":"記住核心辨識句：「適合複雜推理」。情境題先找題幹中的任務、資料與限制。","number":"F-04"},{"code":"F","section":"提示、檢索與智能體","color":"#2980B9","term":"檢索增強生成","english":"Retrieval-Augmented Generation","abbr":"RAG","definition":"先從外部知識來源檢索相關內容，再交由模型生成回答。","plain":"可補最新或私有知識，但不等於重新訓練。","exam":"RAG 是先檢索再生成，不是重新訓練模型。","number":"F-05"},{"code":"F","section":"提示、檢索與智能體","color":"#2980B9","term":"嵌入向量","english":"Embedding","abbr":"","definition":"把文字、影像等轉成能表達語意關係的數值向量。","plain":"語意越接近，向量距離通常越近。","exam":"記住核心辨識句：「語意越接近，向量距離通常越近」。情境題先找題幹中的任務、資料與限制。","number":"F-06"},{"code":"F","section":"提示、檢索與智能體","color":"#2980B9","term":"向量資料庫","english":"Vector Database","abbr":"","definition":"儲存嵌入向量並支援相似度搜尋的資料庫。","plain":"常是 RAG 檢索層的一部分。","exam":"記住核心辨識句：「常是 RAG 檢索層的一部分」。情境題先找題幹中的任務、資料與限制。","number":"F-07"},{"code":"F","section":"提示、檢索與智能體","color":"#2980B9","term":"微調","english":"Fine-tuning","abbr":"","definition":"以特定資料繼續訓練既有模型，使行為更符合特定任務或風格。","plain":"改變模型行為；不是查詢最新資料的首選。","exam":"微調用來改變模型行為或風格，不是補充最新知識的首選。","number":"F-08"},{"code":"F","section":"提示、檢索與智能體","color":"#2980B9","term":"AI 智能體","english":"AI Agent","abbr":"","definition":"能依目標規劃步驟、使用工具、觀察結果並持續行動的 AI 系統。","plain":"聊天機器人偏對話；Agent 強調自主執行。","exam":"Agent 強調目標、規劃、工具、觀察與持續行動；不只是對話。","number":"F-09"},{"code":"F","section":"提示、檢索與智能體","color":"#2980B9","term":"應用程式介面","english":"Application Programming Interface","abbr":"API","definition":"讓不同軟體以規定格式請求功能或交換資料的介面。","plain":"像軟體之間的服務窗口。","exam":"記住核心辨識句：「像軟體之間的服務窗口」。情境題先找題幹中的任務、資料與限制。","number":"F-10"},{"code":"F","section":"提示、檢索與智能體","color":"#2980B9","term":"模型脈絡協定","english":"Model Context Protocol","abbr":"MCP","definition":"讓 AI 應用以標準方式連接工具、資源與資料來源的開放協定。","plain":"重點是標準化連接，不是模型本身。","exam":"記住核心辨識句：「重點是標準化連接，不是模型本身」。情境題先找題幹中的任務、資料與限制。","number":"F-11"},{"code":"G","section":"No-code、系統與導入","color":"#27AE60","term":"無程式碼","english":"No-code","abbr":"","definition":"透過視覺化元件與設定建立應用，幾乎不需撰寫程式。","plain":"上手快，但客製與效能彈性較小。","exam":"記住核心辨識句：「上手快，但客製與效能彈性較小」。情境題先找題幹中的任務、資料與限制。","number":"G-01"},{"code":"G","section":"No-code、系統與導入","color":"#27AE60","term":"低程式碼","english":"Low-code","abbr":"","definition":"以視覺化開發為主，必要時可加入程式碼擴充。","plain":"兼顧速度與一定程度客製化。","exam":"記住核心辨識句：「兼顧速度與一定程度客製化」。情境題先找題幹中的任務、資料與限制。","number":"G-02"},{"code":"G","section":"No-code、系統與導入","color":"#27AE60","term":"工作流程","english":"Workflow","abbr":"","definition":"把任務、條件、角色與資料流依順序串接的作業流程。","plain":"常見結構：觸發→處理→判斷→輸出。","exam":"記住核心辨識句：「常見結構：觸發→處理→判斷→輸出」。情境題先找題幹中的任務、資料與限制。","number":"G-03"},{"code":"G","section":"No-code、系統與導入","color":"#27AE60","term":"Webhook","english":"Webhook","abbr":"","definition":"事件發生時，由來源系統主動把資料推送到指定網址。","plain":"API 常是主動查詢；Webhook 是事件通知。","exam":"Webhook 是事件發生後主動推送；API 常由呼叫端主動查詢。","number":"G-04"},{"code":"G","section":"No-code、系統與導入","color":"#27AE60","term":"機器人流程自動化","english":"Robotic Process Automation","abbr":"RPA","definition":"以軟體機器人模仿規則明確、重複性的電腦操作。","plain":"適合穩定流程，不等同具推理能力的 AI。","exam":"記住核心辨識句：「適合穩定流程，不等同具推理能力的 AI」。情境題先找題幹中的任務、資料與限制。","number":"G-05"},{"code":"G","section":"No-code、系統與導入","color":"#27AE60","term":"概念驗證","english":"Proof of Concept","abbr":"PoC","definition":"用最小實驗驗證技術或構想是否可行。","plain":"回答『做不做得到』。","exam":"PoC 驗證「做不做得到」；Prototype 看「如何呈現」；MVP 驗證「是否有人願意用」。","number":"G-06"},{"code":"G","section":"No-code、系統與導入","color":"#27AE60","term":"原型","english":"Prototype","abbr":"","definition":"用可視或可操作版本呈現流程與介面，供溝通和測試。","plain":"回答『看起來與用起來如何』。","exam":"記住核心辨識句：「回答『看起來與用起來如何』」。情境題先找題幹中的任務、資料與限制。","number":"G-07"},{"code":"G","section":"No-code、系統與導入","color":"#27AE60","term":"最小可行產品","english":"Minimum Viable Product","abbr":"MVP","definition":"具最少必要功能、可交給真實使用者驗證價值的產品版本。","plain":"回答『使用者願不願意用』。","exam":"記住核心辨識句：「回答『使用者願不願意用』」。情境題先找題幹中的任務、資料與限制。","number":"G-08"},{"code":"G","section":"No-code、系統與導入","color":"#27AE60","term":"使用案例","english":"Use Case","abbr":"","definition":"描述特定使用者在特定情境下，透過系統達成目標的方式。","plain":"應寫清楚輸入、處理、輸出與行動。","exam":"記住核心辨識句：「應寫清楚輸入、處理、輸出與行動」。情境題先找題幹中的任務、資料與限制。","number":"G-09"},{"code":"G","section":"No-code、系統與導入","color":"#27AE60","term":"總持有成本","english":"Total Cost of Ownership","abbr":"TCO","definition":"系統全生命週期的採購、建置、維運、人力、訓練與退出成本。","plain":"不能只看訂閱費或模型單價。","exam":"記住核心辨識句：「不能只看訂閱費或模型單價」。情境題先找題幹中的任務、資料與限制。","number":"G-10"},{"code":"G","section":"No-code、系統與導入","color":"#27AE60","term":"投資報酬率","english":"Return on Investment","abbr":"ROI","definition":"投資帶來的淨效益相對於投資成本的比例。","plain":"常見公式：(效益−成本)／成本。","exam":"記住核心辨識句：「常見公式：(效益−成本)／成本」。情境題先找題幹中的任務、資料與限制。","number":"G-11"},{"code":"G","section":"No-code、系統與導入","color":"#27AE60","term":"買或自建","english":"Buy or Build","abbr":"","definition":"在採購現成方案與自行開發之間，依策略、能力、成本與風險選擇。","plain":"通用需求偏 Buy；核心差異化可能偏 Build。","exam":"情境題要同時考量技術控制、管理制度與人員責任，不能只靠模型設定。","number":"G-12"},{"code":"G","section":"No-code、系統與導入","color":"#27AE60","term":"軟體即服務","english":"Software as a Service","abbr":"SaaS","definition":"由供應商透過網路提供與維運的軟體服務模式。","plain":"部署快，但需注意資料與供應商鎖定。","exam":"記住核心辨識句：「部署快，但需注意資料與供應商鎖定」。情境題先找題幹中的任務、資料與限制。","number":"G-13"},{"code":"G","section":"No-code、系統與導入","color":"#27AE60","term":"雲端部署","english":"Cloud Deployment","abbr":"","definition":"在雲端供應商基礎設施上運行系統或模型。","plain":"彈性高；需評估法遵、連線與資料風險。","exam":"記住核心辨識句：「彈性高」。情境題先找題幹中的任務、資料與限制。","number":"G-14"},{"code":"G","section":"No-code、系統與導入","color":"#27AE60","term":"地端部署","english":"On-premises Deployment","abbr":"On-prem","definition":"在組織自有或管控的機房與設備上運行系統。","plain":"控制度高；建置與維運成本通常較高。","exam":"記住核心辨識句：「控制度高」。情境題先找題幹中的任務、資料與限制。","number":"G-15"},{"code":"G","section":"No-code、系統與導入","color":"#27AE60","term":"混合部署","english":"Hybrid Deployment","abbr":"","definition":"同時結合雲端與地端，依資料敏感度和工作負載分配。","plain":"兼顧彈性與控制，但整合更複雜。","exam":"情境題要同時考量技術控制、管理制度與人員責任，不能只靠模型設定。","number":"G-16"},{"code":"H","section":"風險、治理與維運","color":"#E74C3C","term":"偏誤","english":"Bias","abbr":"","definition":"資料、設計或使用情境造成系統性不公平或錯誤傾向。","plain":"需從資料、模型、流程與結果持續檢查。","exam":"記住核心辨識句：「需從資料、模型、流程與結果持續檢查」。情境題先找題幹中的任務、資料與限制。","number":"H-01"},{"code":"H","section":"風險、治理與維運","color":"#E74C3C","term":"可解釋性","english":"Explainability","abbr":"XAI","definition":"讓人能理解模型輸出依據、影響因素或推理脈絡的程度。","plain":"高風險決策通常更需要可解釋性。","exam":"記住核心辨識句：「高風險決策通常更需要可解釋性」。情境題先找題幹中的任務、資料與限制。","number":"H-02"},{"code":"H","section":"風險、治理與維運","color":"#E74C3C","term":"人在迴路","english":"Human-in-the-loop","abbr":"HITL","definition":"在人機流程關鍵節點由人審核、修正或批准 AI 結果。","plain":"人要有權限、能力與足夠資訊介入。","exam":"HITL 必須讓人能實際審核、修正或否決，不是形式簽核。","number":"H-03"},{"code":"H","section":"風險、治理與維運","color":"#E74C3C","term":"自動化偏誤","english":"Automation Bias","abbr":"","definition":"人過度相信自動化系統，忽略反證或自身判斷的傾向。","plain":"HITL 若只是形式審核，仍可能失效。","exam":"記住核心辨識句：「HITL 若只是形式審核，仍可能失效」。情境題先找題幹中的任務、資料與限制。","number":"H-04"},{"code":"H","section":"風險、治理與維運","color":"#E74C3C","term":"提示注入","english":"Prompt Injection","abbr":"","definition":"攻擊者以惡意指令誘使模型忽略原規則、洩露資訊或濫用工具。","plain":"輸入不可信；需隔離、最小權限與輸出檢查。","exam":"記住核心辨識句：「輸入不可信」。情境題先找題幹中的任務、資料與限制。","number":"H-05"},{"code":"H","section":"風險、治理與維運","color":"#E74C3C","term":"資料外洩","english":"Data Leakage","abbr":"","definition":"敏感或受管制資料被未授權存取、傳送、暴露或用於訓練。","plain":"導入前需訂定可輸入／不可輸入資料。","exam":"情境題要同時考量技術控制、管理制度與人員責任，不能只靠模型設定。","number":"H-06"},{"code":   {"code":"G","section":"生成式 AI 導入評估","color":"#27AE60","topic":"L12301","term":"關鍵績效指標","english":"Key Performance Indicator","abbr":"KPI","definition":"用來衡量專案或營運目標達成程度的關鍵量化或質化指標。","plain":"先訂成功標準，才知道 AI 導入後是否真的改善。","exam":"KPI 應連結業務目標；模型 Accuracy 只是技術指標，通常不能單獨代表導入成功。","number":"G-24"},
  {"code":"G","section":"生成式 AI 導入評估","color":"#27AE60","topic":"L12301","term":"基準測試","english":"Benchmark","abbr":"","definition":"以固定題目、資料、標準答案與評分規則，公平比較模型或方案表現的方法。","plain":"讓不同工具考同一份考卷，再用相同標準評分。","exam":"比較工具時需固定測試集與規則；不可只憑單次示範、主觀印象或供應商宣稱。","number":"G-25"},
  {"code":"G","section":"生成式 AI 導入評估","color":"#27AE60","topic":"L12301","term":"延遲","english":"Latency","abbr":"","definition":"從送出請求到收到回應所需的時間，常用毫秒或秒衡量。","plain":"延遲回答「一次要等多久」。","exam":"Latency 衡量單次回應速度；Throughput 衡量單位時間可處理多少工作，兩者不可混為一談。","number":"G-26"},
  {"code":"G","section":"生成式 AI 導入評估","color":"#27AE60","topic":"L12301","term":"吞吐量","english":"Throughput","abbr":"","definition":"系統在單位時間內可處理的請求、交易、資料或 Token 數量。","plain":"吞吐量回答「一段時間能做多少」。","exam":"高流量場景需同時評估延遲與吞吐量；QPS、TPS 是常見吞吐量指標。","number":"G-27"},
  {"code":"G","section":"生成式 AI 導入評估","color":"#27AE60","topic":"L12301","term":"每秒查詢數","english":"Queries per Second","abbr":"QPS","definition":"系統每秒能處理的查詢或請求數量，是衡量服務吞吐能力的指標。","plain":"像計算服務每秒能接幾位客人。","exam":"QPS 偏向查詢或請求；TPS 偏向完成的交易，應依實際工作負載選擇指標。","number":"G-28"},
  {"code":"G","section":"生成式 AI 導入評估","color":"#27AE60","topic":"L12301","term":"每秒交易數","english":"Transactions per Second","abbr":"TPS","definition":"系統每秒完成的交易數量，常用於衡量具完整處理與提交意義的工作負載。","plain":"不是只收到請求，而是完成一筆可認定的交易。","exam":"TPS 的交易定義必須先說清楚；不可在未定義工作內容時直接比較不同系統。","number":"G-29"},
  {"code":"G","section":"生成式 AI 導入評估","color":"#27AE60","topic":"L12301","term":"敏感度分析","english":"Sensitivity Analysis","abbr":"","definition":"改變成本、效益、需求量或其他關鍵假設，觀察評估結果如何變動的方法。","plain":"把重要數字調高或調低，看看結論會不會翻轉。","exam":"敏感度分析用來檢查決策對假設變動的耐受度，適合補強 TCO、ROI 與效益估算。","number":"G-30"},
  {"code":"G","section":"生成式 AI 導入規劃","color":"#2980B9","topic":"L12302","term":"由上而下","english":"Top-down","abbr":"","definition":"由高階策略、治理原則與企業目標出發，再向下展開平台、制度與部門應用的導入方式。","plain":"先由公司決定方向與共同規則，再讓各部門執行。","exam":"Top-down 有利一致治理與資源整合，但可能距離第一線需求較遠；常與 Bottom-up 雙軌並行。","number":"G-31"},
  {"code":"G","section":"生成式 AI 導入規劃","color":"#2980B9","topic":"L12302","term":"由下而上","english":"Bottom-up","abbr":"","definition":"從部門痛點、使用者需求與小型實驗出發，逐步驗證並擴散至組織的導入方式。","plain":"先從第一線好用的小案例做起，再把成功方法放大。","exam":"Bottom-up 有利貼近場景與快速試驗，但若缺乏共同治理，容易形成重複工具與 Shadow IT。","number":"G-32"},
  {"code":"G","section":"生成式 AI 導入規劃","color":"#2980B9","topic":"L12302","term":"雙軌策略","english":"Dual-track Strategy","abbr":"","definition":"同時以中央平台與治理推動 Top-down，並由部門場景進行 Bottom-up 試驗，再共同審查與重用擴散。","plain":"中央訂規則、部門找案例，成功後再變成大家可用的能力。","exam":"雙軌策略重點是中央平台、部門場景、共同審查與重用擴散，不是兩套互不相干的系統。","number":"G-33"},
  {"code":"G","section":"生成式 AI 導入規劃","color":"#2980B9","topic":"L12302","term":"導入路線圖","english":"Roadmap","abbr":"","definition":"依近期、中期與長期安排目標、里程碑、依賴關係、資源與進入下一階段門檻的導入計畫。","plain":"把先做什麼、何時完成、達到什麼條件才能繼續畫成路線。","exam":"Roadmap 不只是時間表；每階段應有交付物、成功指標、停止條件與決策門檻。","number":"G-34"},
  {"code":"G","section":"生成式 AI 導入規劃","color":"#2980B9","topic":"L12302","term":"試點","english":"Pilot","abbr":"","definition":"在有限但接近真實的環境與使用者範圍內運行方案，驗證營運可行性與實際成效。","plain":"PoC 證明做得到；Pilot 則讓小範圍真實使用，觀察能不能穩定運作。","exam":"常考比較：PoC 驗證技術可行性；Pilot 驗證真實流程、使用者採用、營運與擴充條件。","number":"G-35"},
  {"code":"G","section":"生成式 AI 導入規劃","color":"#2980B9","topic":"L12302","term":"A／B 測試","english":"A/B Testing","abbr":"","definition":"將使用者或流量分配到兩個版本，以預先定義的指標比較哪個方案表現較佳的實驗方法。","plain":"讓兩組條件公平比賽，再用數據決定。","exam":"A/B 測試需控制其他條件、隨機分組並先定義指標；不可只比較不同時間或不同族群後直接下因果結論。","number":"G-36"},
  {"code":"G","section":"生成式 AI 導入規劃","color":"#2980B9","topic":"L12302","term":"機器學習維運","english":"Machine Learning Operations","abbr":"MLOps","definition":"整合資料、模型、程式、部署、監控與治理，使機器學習系統能持續可靠交付的實務。","plain":"把模型從實驗室帶到正式環境，並持續監控、更新與回滾。","exam":"MLOps 涵蓋資料與模型生命週期；DevOps 主要聚焦軟體交付，兩者相互配合但不完全相同。","number":"G-37"},
  {"code":"G","section":"生成式 AI 導入規劃","color":"#2980B9","topic":"L12302","term":"持續整合交付訓練","english":"Continuous Integration／Delivery／Training","abbr":"CI／CD／CT","definition":"CI 持續整合程式變更，CD 持續交付或部署可用版本，CT 則在條件符合時持續重新訓練模型。","plain":"程式持續合併與發布，模型也依新資料持續更新。","exam":"CT 是 ML 系統特有重點，不等同 CD；自動重新訓練仍需資料驗證、模型評估、核准與回滾。","number":"G-38"},
  {"code":"G","section":"生成式 AI 導入規劃","color":"#2980B9","topic":"L12302","term":"權責分工矩陣","english":"Responsible–Accountable–Consulted–Informed","abbr":"RACI","definition":"以負責執行、最終負責、需諮詢與需知會四種角色，釐清任務權責的矩陣。","plain":"說清楚誰做、誰拍板、問誰意見、通知誰。","exam":"每項任務宜有明確的 Accountable 最終負責者；Responsible 是實際執行者，兩者不可混淆。","number":"G-39"},
  {"code":"H","section":"生成式 AI 風險管理","color":"#E74C3C","topic":"L12303","term":"風險矩陣","english":"Risk Matrix","abbr":"","definition":"以發生可能性與衝擊程度交叉評估風險等級，協助排序處理優先順序的工具。","plain":"越可能發生、後果越嚴重，通常越需要優先處理。","exam":"風險矩陣是定性或半定量工具；評分尺度、風險準則與責任人應先定義並一致使用。","number":"H-14"},
  {"code":"H","section":"生成式 AI 風險管理","color":"#E74C3C","topic":"L12303","term":"固有風險","english":"Inherent Risk","abbr":"","definition":"尚未考量任何控制措施前，活動或系統原本具有的風險程度。","plain":"先假設還沒有防護，看原始風險有多大。","exam":"固有風險在控制前評估；剩餘風險在控制後評估，兩者不可顛倒。","number":"H-15"},
  {"code":"H","section":"生成式 AI 風險管理","color":"#E74C3C","topic":"L12303","term":"剩餘風險","english":"Residual Risk","abbr":"","definition":"控制措施實施後仍然存在的風險，需與組織風險準則比較以決定是否接受或再處理。","plain":"裝了防護之後，還剩下多少風險。","exam":"控制措施通常只能降低風險，不能保證歸零；剩餘風險超過容許程度時需再處理或升級決策。","number":"H-16"},
  {"code":"H","section":"生成式 AI 風險管理","color":"#E74C3C","topic":"L12303","term":"風險偏好","english":"Risk Appetite","abbr":"","definition":"組織為追求目標而願意承擔的整體風險類型與程度。","plain":"組織願意承受多少風險，換取多少機會或效益。","exam":"Risk Appetite 是整體取向；實際風險接受仍需依風險準則、授權層級與剩餘風險判斷。","number":"H-17"},
  {"code":"H","section":"生成式 AI 風險管理","color":"#E74C3C","topic":"L12303","term":"風險處理","english":"Risk Treatment","abbr":"","definition":"對已評估風險採取避免、降低、移轉或接受等策略，並配置責任、資源與期限。","plain":"可以不做、加強防護、轉給別人承擔，或在授權下接受。","exam":"四種常見策略為 Avoid、Mitigate、Transfer、Accept；接受風險不等於忽略，仍需核准與監控。","number":"H-18"},
  {"code":"H","section":"生成式 AI 風險管理","color":"#E74C3C","topic":"L12303","term":"防護欄","english":"Guardrails","abbr":"","definition":"以政策、流程與技術限制 AI 可接受輸入、輸出、工具權限與行為範圍的控制組合。","plain":"像在道路兩旁加護欄，降低 AI 跑出安全範圍的機會。","exam":"Guardrails 不是單一提示詞；可包含內容過濾、權限、DLP、輸出驗證、HITL、日誌與速率限制。","number":"H-19"},
  {"code":"H","section":"生成式 AI 風險管理","color":"#E74C3C","topic":"L12303","term":"緊急停止開關","english":"Kill Switch","abbr":"","definition":"當系統出現重大異常、濫用或不可接受風險時，可立即停止模型、工具或自動化流程的機制。","plain":"情況失控時，可以快速按下總停止鍵。","exam":"Kill Switch 需搭配觸發條件、授權人、復原與通報流程；只有開關但無治理程序並不足夠。","number":"H-20"},
  {"code":"H","section":"生成式 AI 風險管理","color":"#E74C3C","topic":"L12303","term":"根因分析","english":"Root Cause Analysis","abbr":"RCA","definition":"系統性找出事件背後的根本原因，而非只修補表面症狀的方法。","plain":"不只問哪裡壞了，還要追問為什麼會壞、為什麼沒提早發現。","exam":"事件處理先控制損害與復原，再進行 RCA；根因分析結果應轉為矯正與預防措施。","number":"H-21"},
  {"code":"H","section":"生成式 AI 風險管理","color":"#E74C3C","topic":"L12303","term":"矯正與預防措施","english":"Corrective and Preventive Action","abbr":"CAPA","definition":"針對已發生問題消除根因的矯正措施，以及防止類似問題發生的預防措施。","plain":"修好這次問題，也修改制度避免下次再發。","exam":"CAPA 應有責任人、期限、成效驗證與結案證據；只完成臨時修補不代表已完成矯正。","number":"H-22"},
  {"code":"H","section":"生成式 AI 風險管理","color":"#E74C3C","topic":"L12303","term":"供應商鎖定","english":"Vendor Lock-in","abbr":"","definition":"因專有格式、介面、資料、流程或契約限制，使組織難以更換供應商或移轉方案的風險。","plain":"用了某家服務後，資料和流程很難搬家。","exam":"降低 Vendor Lock-in 可採開放格式、API、文件、資料匯出、替代方案與出口條款。","number":"H-23"}
];

  {"code":"A","section":"人工智慧基礎","color":"#4A2E80","topic":"L11101","term":"機器人學","english":"Robotics","abbr":"","definition":"整合感測、控制、機械、規劃與人工智慧，使實體機器能感知環境並採取行動的領域。","plain":"AI 可以當大腦，機器人的感測器和機械裝置負責看、聽與動作。","exam":"Robotics 不等於 AI；機器人可只依固定程式運作，AI 也可完全存在於軟體中。","number":"A-15"},
  {"code":"H","section":"AI 治理與倫理","color":"#E74C3C","topic":"L11102","term":"人工智慧治理","english":"Artificial Intelligence Governance","abbr":"AI Governance","definition":"以政策、角色、流程、控制與監督機制，確保人工智慧在全生命週期被負責任地開發與使用。","plain":"不只管模型，也要管資料、人員、供應商、權限、紀錄與責任。","exam":"AI Governance 是持續性的管理制度，不等於一次性的倫理聲明或模型測試。","number":"H-24"},
  {"code":"H","section":"AI 治理與倫理","color":"#E74C3C","topic":"L11102","term":"可信任人工智慧","english":"Trustworthy Artificial Intelligence","abbr":"Trustworthy AI","definition":"兼顧合法、合乎倫理且技術穩健，並具安全、公平、透明、可問責等特性的人工智慧。","plain":"AI 不只要好用，也要可靠、安全、公平並有人負責。","exam":"Trustworthy AI 涵蓋多項治理品質，不能只以模型 Accuracy 高就判定可信任。","number":"H-25"},
  {"code":"H","section":"AI 治理與倫理","color":"#E74C3C","topic":"L11102","term":"人工智慧倫理","english":"Artificial Intelligence Ethics","abbr":"AI Ethics","definition":"探討人工智慧設計與使用對人權、公平、隱私、自主、社會與環境造成影響的原則與實務。","plain":"思考 AI 應不應該這樣做，以及會不會傷害人或造成不公平。","exam":"AI Ethics 提供價值原則；AI Governance 則把原則轉成角色、流程、控制與證據。","number":"H-26"},
  {"code":"H","section":"AI 治理與倫理","color":"#E74C3C","topic":"L11102","term":"公平性","english":"Fairness","abbr":"","definition":"人工智慧對不同個人或群體的結果不應產生無正當理由的差別待遇或系統性不利。","plain":"不能因性別、年齡或其他群體特徵，讓某些人一直吃虧。","exam":"Fairness 不必然等於每一群體結果完全相同；需依情境、法律與公平指標判斷。","number":"H-27"},
  {"code":"H","section":"AI 治理與倫理","color":"#E74C3C","topic":"L11102","term":"透明性","english":"Transparency","abbr":"","definition":"適當揭露人工智慧的用途、資料、限制、決策流程與責任資訊，使利害關係人能理解並監督。","plain":"讓使用者知道何時在和 AI 互動、AI 用來做什麼及有哪些限制。","exam":"Transparency 強調資訊揭露；Explainability 強調能說明特定輸出的依據，兩者相關但不同。","number":"H-28"},
  {"code":"H","section":"AI 治理與倫理","color":"#E74C3C","topic":"L11102","term":"可問責性","english":"Accountability","abbr":"","definition":"對人工智慧的決策、影響與風險指定明確責任人，並建立審查、申訴、矯正與追蹤機制。","plain":"AI 出問題時，必須知道誰負責、怎麼調查和改善。","exam":"Accountability 不能把責任推給模型；組織仍需設置 Owner、權責與監督證據。","number":"H-29"},
  {"code":"H","section":"AI 治理與倫理","color":"#E74C3C","topic":"L11102","term":"人類監督","english":"Human Oversight","abbr":"","definition":"由具備權限與能力的人員監看人工智慧運作，並能在必要時介入、修正、拒絕或停止系統。","plain":"人不只是看結果，還要真的能踩煞車。","exam":"Human Oversight 是治理要求；HITL 是其中一種流程設計，形式簽核不代表有效監督。","number":"H-30"},
  {"code":"H","section":"AI 治理與倫理","color":"#E74C3C","topic":"L11102","term":"隱私保護設計","english":"Privacy by Design","abbr":"PbD","definition":"從系統規劃與設計初期即把個資最小化、目的限制、安全與使用者權利納入，而非事後補救。","plain":"一開始就把隱私裝進系統，不是出問題後才補洞。","exam":"Privacy by Design 強調預防與全生命週期；常見措施包括資料最小化、存取控制與保存期限。","number":"H-31"},
  {"code":"H","section":"AI 治理與倫理","color":"#E74C3C","topic":"L11102","term":"風險基礎方法","english":"Risk-based Approach","abbr":"","definition":"依人工智慧用途的風險程度配置不同強度的評估、控制、監督與文件要求。","plain":"風險越高，檢查和防護就要越嚴格。","exam":"Risk-based Approach 不是所有 AI 一律禁止或採相同控制；應依影響、可能性與情境分級。","number":"H-32"},
  {"code":"H","section":"AI 治理與倫理","color":"#E74C3C","topic":"L11102","term":"演算法影響評估","english":"Algorithmic Impact Assessment","abbr":"AIA","definition":"在系統導入前或重大變更時，系統性評估演算法對權利、公平、隱私、安全與社會可能造成的影響。","plain":"AI 上線前先做風險體檢，找出誰可能受影響以及如何降低傷害。","exam":"AIA 重點是辨識影響、利害關係人、風險與控制；不是只做模型 Accuracy 測試。","number":"H-33"}

  {"code":"B","section":"資料基本概念與來源","color":"#2980B9","topic":"L11201","term":"半結構化資料","english":"Semi-structured Data","abbr":"","definition":"沒有固定關聯式表格欄位，但利用標籤、鍵值或階層結構保留部分組織規則的資料。","plain":"不像試算表那麼整齊，但仍有標籤或結構可協助電腦讀取，例如 JSON、XML。","exam":"CSV 通常視為結構化資料；JSON、XML 常屬半結構化資料；圖片與自由文字多屬非結構化資料。","number":"B-13"},
  {"code":"B","section":"資料基本概念與來源","color":"#2980B9","topic":"L11201","term":"定量資料","english":"Quantitative Data","abbr":"","definition":"能以數值表示、計算或進行統計分析的資料，可再分為離散型與連續型。","plain":"可以用數字量測或計數，例如年齡、收入、件數與溫度。","exam":"Quantitative 強調數值量；Qualitative 強調類別或特質，類別代碼即使以數字表示也不一定是定量資料。","number":"B-14"},
  {"code":"B","section":"資料基本概念與來源","color":"#2980B9","topic":"L11201","term":"定性資料","english":"Qualitative Data","abbr":"","definition":"描述類別、性質、意見或特徵的非數值性資料，常以名目或次序尺度呈現。","plain":"用來說明是什麼種類或有什麼特性，例如顏色、職業、滿意程度。","exam":"Qualitative 資料可以編碼成數字供模型使用，但編碼後不代表數字之間可以任意加減。","number":"B-15"},
  {"code":"B","section":"資料基本概念與來源","color":"#2980B9","topic":"L11201","term":"第一方資料","english":"First-party Data","abbr":"1P Data","definition":"組織透過自己與客戶或使用者的直接互動所蒐集並管理的資料。","plain":"公司自己從會員、網站、交易或客服取得的資料。","exam":"First-party Data 由組織直接取得，通常較能掌握來源、同意與品質；仍須遵守目的限制及個資規範。","number":"B-16"},
  {"code":"B","section":"資料基本概念與來源","color":"#2980B9","topic":"L11201","term":"第二方資料","english":"Second-party Data","abbr":"2P Data","definition":"其他組織將其第一方資料，以合作、授權或契約方式提供給本組織使用的資料。","plain":"合作夥伴把他自己直接蒐集的資料提供給你。","exam":"Second-party Data 本質上是他人的 First-party Data；應確認契約、使用目的、合法依據與資料品質。","number":"B-17"},
  {"code":"B","section":"資料基本概念與來源","color":"#2980B9","topic":"L11201","term":"第三方資料","english":"Third-party Data","abbr":"3P Data","definition":"由與資料當事人沒有直接關係的外部資料商，彙整多種來源後提供或販售的資料。","plain":"向外部資料公司取得的市場或受眾資料。","exam":"Third-party Data 覆蓋面可能較廣，但來源透明度、合法性、時效與偏誤風險通常需特別查核。","number":"B-18"},
  {"code":"B","section":"資料基本概念與來源","color":"#2980B9","topic":"L11201","term":"中繼資料","english":"Metadata","abbr":"","definition":"描述其他資料的內容、格式、來源、時間、權限或品質等特性的資料。","plain":"資料的說明卡，例如檔名、作者、建立時間、欄位型態和版本。","exam":"Metadata 是『描述資料的資料』；可支援搜尋、治理、血緣追蹤與品質管理，但不等同原始內容。","number":"B-19"},
  {"code":"B","section":"資料基本概念與來源","color":"#2980B9","topic":"L11201","term":"資料庫","english":"Database","abbr":"DB","definition":"依特定資料模型組織、儲存與管理資料，並支援查詢、新增、修改與刪除的系統。","plain":"把資料有規則地放好，讓系統可以快速找出與更新。","exam":"Database 是一般概念；關聯式資料庫以資料表與關聯為主，NoSQL 則可採文件、鍵值、圖形等模型。","number":"B-20"},
  {"code":"B","section":"資料基本概念與來源","color":"#2980B9","topic":"L11201","term":"資料倉儲","english":"Data Warehouse","abbr":"DW","definition":"將多個來源的結構化資料整合、清理並依主題保存，以支援報表、商業智慧與分析的集中式儲存環境。","plain":"把整理過的企業資料集中起來，方便做固定報表和分析。","exam":"Data Warehouse 偏向治理後的結構化分析資料；Data Lake 可保留大量原始及多格式資料。","number":"B-21"},
  {"code":"B","section":"資料基本概念與來源","color":"#2980B9","topic":"L11201","term":"資料湖","english":"Data Lake","abbr":"","definition":"以原始或近原始格式集中保存大量結構化、半結構化與非結構化資料的儲存架構。","plain":"先把各種資料放進大湖裡，需要時再整理和分析。","exam":"Data Lake 採 Schema-on-read 的概念較常見；缺乏治理時可能形成難以尋找與信任的 Data Swamp。","number":"B-22"},
  {"code":"B","section":"資料基本概念與來源","color":"#2980B9","topic":"L11201","term":"大數據 5V","english":"Big Data 5Vs","abbr":"5V","definition":"以大量、速度、多樣、真實性與價值五個面向描述大數據特徵的框架。","plain":"資料很多、來得快、格式多、可信度要確認，而且最後要能產生價值。","exam":"Volume、Velocity、Variety、Veracity、Value 分別對應量、速度、多樣、真實性與價值。","number":"B-23"},
  {"code":"B","section":"資料基本概念與來源","color":"#2980B9","topic":"L11201","term":"開放資料","english":"Open Data","abbr":"","definition":"依開放授權與可再利用格式公開，使任何人能在規定條件下存取、使用與散布的資料。","plain":"依授權規則公開給大家下載、分析或再利用的資料。","exam":"Open Data 不等於完全沒有條件；仍需確認授權、來源、更新日期、品質及是否含個資。","number":"B-24"},
  {"code":"B","section":"資料隱私與安全","color":"#E74C3C","topic":"L11203","term":"個人可識別資訊","english":"Personally Identifiable Information","abbr":"PII","definition":"可單獨或與其他資料結合，用來直接或間接識別特定個人的資訊。","plain":"能認出是誰的資料，例如姓名、身分證號，或可組合辨識個人的資訊。","exam":"PII 是常見國際用語；實際法律範圍應依適用法規判定，去除姓名不一定已無法識別。","number":"B-25"},
  {"code":"B","section":"資料隱私與安全","color":"#E74C3C","topic":"L11203","term":"敏感個人資料","english":"Sensitive Personal Data","abbr":"","definition":"一旦不當蒐集、使用或揭露，可能對個人權益造成較高風險，因而需要較嚴格保護的個人資料。","plain":"像健康、基因、生物辨識等資料，外洩後可能造成更嚴重傷害。","exam":"敏感資料的法定類別因地區而異；處理前應確認合法依據、必要性、權限及加強保護措施。","number":"B-26"},
  {"code":"B","section":"資料隱私與安全","color":"#E74C3C","topic":"L11203","term":"資料最小化","english":"Data Minimization","abbr":"","definition":"僅蒐集、處理與保存達成特定合法目的所必要且適量的資料。","plain":"只拿真正需要的資料，不要因為可能有用就全部收集。","exam":"Data Minimization 可降低外洩與濫用風險；應與目的限制、保存期限及權限管理搭配。","number":"B-27"},
  {"code":"B","section":"資料隱私與安全","color":"#E74C3C","topic":"L11203","term":"資料當事人同意","english":"Consent","abbr":"","definition":"資料當事人在獲得適當資訊後，以自由、具體且明確的方式同意其個人資料被處理。","plain":"先說清楚要拿什麼、做什麼，再讓本人真正選擇是否同意。","exam":"Consent 不是所有處理活動唯一的合法依據；若採同意，應能證明並提供適當撤回機制。","number":"B-28"},
  {"code":"B","section":"資料隱私與安全","color":"#E74C3C","topic":"L11203","term":"匿名化","english":"Anonymization","abbr":"","definition":"以合理可行的方法處理資料，使個人無法被直接或間接重新識別，且該狀態具有不可逆性或極低回復可能。","plain":"把資料處理到無法合理找回是誰。","exam":"Anonymization 與 Pseudonymization 不同；若仍可透過對照表還原身分，通常只是去識別化或假名化。","number":"B-29"},
  {"code":"B","section":"資料隱私與安全","color":"#E74C3C","topic":"L11203","term":"假名化","english":"Pseudonymization","abbr":"","definition":"以代碼或假名取代直接識別資訊，並將可重新連結個人的附加資訊分開保護。","plain":"先用編號代替姓名，但保留受控的對照方式。","exam":"Pseudonymization 可降低風險但通常仍屬個人資料，因為持有附加資訊者仍可能重新識別。","number":"B-30"},
  {"code":"B","section":"資料隱私與安全","color":"#E74C3C","topic":"L11203","term":"加密","english":"Encryption","abbr":"","definition":"使用演算法與金鑰將可讀資料轉換為未授權者難以理解的密文，以保護傳輸中或儲存中的資料。","plain":"把資料鎖成密文，只有有正確金鑰的人才能解開。","exam":"Encryption 保護機密性，不會自動保證資料正確性或使用者身分；金鑰管理同樣重要。","number":"B-31"},
  {"code":"B","section":"資料隱私與安全","color":"#E74C3C","topic":"L11203","term":"資訊安全三要素","english":"Confidentiality, Integrity and Availability Triad","abbr":"CIA Triad","definition":"以機密性、完整性與可用性三項核心目標衡量資訊安全保護是否完整。","plain":"資料只能給該看的人、不能被亂改，而且需要時能正常使用。","exam":"Confidentiality 防未授權揭露；Integrity 防未授權竄改；Availability 確保授權者需要時可取得。","number":"B-32"},
  {"code":"B","section":"資料隱私與安全","color":"#E74C3C","topic":"L11203","term":"最小權限原則","english":"Principle of Least Privilege","abbr":"PoLP","definition":"使用者、程式或服務只取得完成工作所需的最低權限，並限制權限範圍與期間。","plain":"只給完成任務剛好需要的鑰匙，不給整棟大樓的萬用鑰匙。","exam":"Least Privilege 可降低帳號遭濫用後的損害；應搭配定期權限審查與離職、轉調回收。","number":"B-33"},
  {"code":"B","section":"資料隱私與安全","color":"#E74C3C","topic":"L11203","term":"角色型存取控制","english":"Role-based Access Control","abbr":"RBAC","definition":"依使用者在組織中的角色配置權限，再將人員指派至適當角色的存取控制方法。","plain":"先規定會計、主管、管理員各能做什麼，再把人放進對應角色。","exam":"RBAC 依角色授權，可簡化管理；仍須遵循最小權限，避免角色累積過多權限。","number":"B-34"},
  {"code":"B","section":"資料隱私與安全","color":"#E74C3C","topic":"L11203","term":"多因素驗證","english":"Multi-factor Authentication","abbr":"MFA","definition":"使用兩種以上不同類型的驗證因素確認身分，例如知識、持有物與生物特徵。","plain":"除了密碼，還要手機驗證碼、安全金鑰或指紋等另一種證明。","exam":"兩組密碼仍屬同一知識因素，不一定構成 MFA；MFA 能降低單一密碼外洩造成的風險。","number":"B-35"},
  {"code":"B","section":"資料隱私與安全","color":"#E74C3C","topic":"L11203","term":"資料治理","english":"Data Governance","abbr":"","definition":"透過政策、角色、標準、流程與監督，管理資料的品質、安全、隱私、生命週期與可用性。","plain":"訂清楚資料誰負責、怎麼命名、誰能用、保存多久，以及如何確保可信。","exam":"Data Governance 是管理制度；Data Management 是執行資料蒐集、儲存、整合與維護等活動。","number":"B-36"},
  {"code":"B","section":"資料隱私與安全","color":"#E74C3C","topic":"L11203","term":"資料血緣","english":"Data Lineage","abbr":"","definition":"記錄資料從來源、轉換、移動到最終報表或模型輸出的流向與處理歷程。","plain":"追蹤一筆資料從哪裡來、中間怎麼改、最後用到哪裡。","exam":"Data Lineage 有助追溯錯誤、影響分析、稽核與模型資料治理；Metadata 可承載血緣資訊。","number":"B-37"},
  {"code":"B","section":"資料隱私與安全","color":"#E74C3C","topic":"L11203","term":"資料保存政策","english":"Data Retention Policy","abbr":"","definition":"規定不同資料保存期間、保存位置、存取條件與期限屆滿後刪除或封存方式的制度。","plain":"訂出資料要留多久、放哪裡，時間到了怎麼安全刪除。","exam":"保存不是越久越好；Retention Policy 應結合法令、契約、業務必要性與資料最小化。","number":"B-38"},

  {"code":"E","section":"鑑別式與生成式 AI 原理","color":"#4A2E80","topic":"L11401","term":"鑑別式模型","english":"Discriminative Model","abbr":"","definition":"直接學習輸入資料與標籤之間的決策邊界或條件機率，用來判斷類別、數值或特定結果的模型。","plain":"看完資料後做判斷，例如判斷郵件是不是垃圾郵件。","exam":"鑑別式模型重點是「判斷、分類或預測」；通常學習 P(y|x)，不以產生全新資料為主要目的。","number":"E-39"},
  {"code":"E","section":"鑑別式與生成式 AI 原理","color":"#4A2E80","topic":"L11401","term":"生成式模型","english":"Generative Model","abbr":"","definition":"學習資料分布或資料生成機制，並依提示、條件或取樣方式產生新的文字、影像、音訊、程式或其他內容。","plain":"先學會資料長什麼樣，再創造新的相似內容。","exam":"生成式模型重點是「產生新內容」；可能學習 P(x) 或 P(x,y)，與只做分類的鑑別式模型不同。","number":"E-40"},
  {"code":"E","section":"鑑別式與生成式 AI 原理","color":"#4A2E80","topic":"L11401","term":"生成對抗網路","english":"Generative Adversarial Network","abbr":"GAN","definition":"由生成器與鑑別器互相競爭訓練的生成式模型；生成器製造資料，鑑別器判斷真實或生成。","plain":"一個負責仿造、一個負責抓假貨，雙方競爭後讓生成結果更逼真。","exam":"GAN 的 Generator 產生樣本，Discriminator 判別真偽；常見風險包括訓練不穩與 Mode Collapse。","number":"E-41"},
  {"code":"E","section":"鑑別式與生成式 AI 原理","color":"#4A2E80","topic":"L11401","term":"生成器","english":"Generator","abbr":"G","definition":"GAN 中接收隨機噪聲或條件資訊並產生候選資料，目標是讓鑑別器難以分辨真假的網路。","plain":"GAN 裡負責製造作品的一方。","exam":"Generator 不負責判斷真偽；它透過鑑別器回傳的訓練訊號改善生成品質。","number":"E-42"},
  {"code":"E","section":"鑑別式與生成式 AI 原理","color":"#4A2E80","topic":"L11401","term":"鑑別器","english":"Discriminator","abbr":"D","definition":"GAN 中判斷輸入樣本是真實資料或生成資料的網路，並提供生成器改善所需的對抗訊號。","plain":"GAN 裡負責驗貨、辨別真假作品的一方。","exam":"Discriminator 是 GAN 的判別元件；部署時不一定與 Generator 一起使用。","number":"E-43"},
  {"code":"E","section":"鑑別式與生成式 AI 原理","color":"#4A2E80","topic":"L11401","term":"模式崩潰","english":"Mode Collapse","abbr":"","definition":"GAN 的生成器只產生少數類型或高度相似的樣本，未能涵蓋真實資料分布多樣性的失敗現象。","plain":"生成器只會做幾種很像的作品，看似逼真卻缺乏變化。","exam":"Mode Collapse 是 GAN 常見問題；品質高但多樣性不足仍可能是模式崩潰。","number":"E-44"},
  {"code":"E","section":"鑑別式與生成式 AI 原理","color":"#4A2E80","topic":"L11401","term":"變分自編碼器","english":"Variational Autoencoder","abbr":"VAE","definition":"以機率化編碼器將資料映射到潛在分布，再由解碼器取樣重建或生成資料的生成式模型。","plain":"先把資料壓成一個可取樣的隱藏空間，再從中解碼出新內容。","exam":"VAE 由 Encoder、Latent Space 與 Decoder 構成；相較 GAN 通常訓練較穩定，但影像可能較平滑。","number":"E-45"},
  {"code":"E","section":"鑑別式與生成式 AI 原理","color":"#4A2E80","topic":"L11401","term":"潛在空間","english":"Latent Space","abbr":"","definition":"模型將資料重要特徵壓縮後形成的隱藏向量空間，可用於取樣、插值、控制或生成內容。","plain":"像把複雜作品放進一張特徵地圖，位置相近通常代表特徵相似。","exam":"Latent Space 不是原始資料庫；它是模型學到的內部表示空間。","number":"E-46"},
  {"code":"E","section":"鑑別式與生成式 AI 原理","color":"#4A2E80","topic":"L11401","term":"擴散模型","english":"Diffusion Model","abbr":"","definition":"訓練模型逐步預測並移除資料中的噪聲，推論時從隨機噪聲反向去噪以生成內容的模型。","plain":"先學會把被噪聲弄亂的圖一步步修回來，生成時再從噪聲慢慢畫出新圖。","exam":"Diffusion 的核心是「加噪與反向去噪」；通常生成品質高，但多步取樣可能使速度較慢。","number":"E-47"},
  {"code":"E","section":"鑑別式與生成式 AI 原理","color":"#4A2E80","topic":"L11401","term":"自回歸模型","english":"Autoregressive Model","abbr":"","definition":"依先前已出現的元素，按順序預測下一個元素，反覆進行以產生完整序列的模型。","plain":"像接龍一樣，根據前面的字一個接一個產生下一個字。","exam":"大型語言模型常採自回歸方式進行 Next-token Prediction；每一步輸出會成為後續生成的條件。","number":"E-48"},
  {"code":"E","section":"鑑別式與生成式 AI 原理","color":"#4A2E80","topic":"L11401","term":"下一詞元預測","english":"Next-token Prediction","abbr":"","definition":"根據目前上下文的詞元序列，估計下一個詞元機率分布並選取或取樣輸出的生成機制。","plain":"AI 看前文後猜下一個 Token，再不斷重複形成回答。","exam":"Next-token Prediction 是許多 LLM 的核心訓練與生成機制，不等於模型會查證事實或真正理解。","number":"E-49"},
  {"code":"E","section":"鑑別式與生成式 AI 原理","color":"#4A2E80","topic":"L11401","term":"基礎模型","english":"Foundation Model","abbr":"FM","definition":"以大規模廣泛資料預訓練，可透過提示、微調或其他方式適配多種下游任務的通用模型。","plain":"先建立一個能力廣的底座，再依不同工作調整使用。","exam":"Foundation Model 強調廣泛預訓練與多任務適配；LLM 是以語言為核心的一類基礎模型。","number":"E-50"},
  {"code":"E","section":"鑑別式與生成式 AI 原理","color":"#4A2E80","topic":"L11401","term":"大型語言模型","english":"Large Language Model","abbr":"LLM","definition":"以大規模文字或多模態資料訓練，能理解與生成自然語言並執行多種語言任務的模型。","plain":"讀過大量資料、能依上下文產生文字的語言模型。","exam":"LLM 的流暢輸出不保證內容正確；須注意 Hallucination、Context Window、Token 與資料時效。","number":"E-51"},
  {"code":"E","section":"鑑別式與生成式 AI 整合應用","color":"#2980B9","topic":"L11402","term":"多模態人工智慧","english":"Multimodal Artificial Intelligence","abbr":"Multimodal AI","definition":"能共同處理或生成文字、影像、音訊、影片等兩種以上資料模態的人工智慧。","plain":"同一個 AI 可以看圖、讀字、聽聲音並整合回答。","exam":"Multimodal 是多種資料型態的整合，不代表模型所有模態能力都同樣可靠。","number":"E-52"},
  {"code":"E","section":"鑑別式與生成式 AI 整合應用","color":"#2980B9","topic":"L11402","term":"文字轉影像","english":"Text-to-Image","abbr":"T2I","definition":"根據文字提示產生符合描述影像的跨模態生成任務。","plain":"輸入一句畫面描述，AI 依文字生成圖片。","exam":"Text-to-Image 是生成式應用；Prompt 會影響主體、風格、構圖與限制，但不能保證完全可控。","number":"E-53"},
  {"code":"E","section":"鑑別式與生成式 AI 整合應用","color":"#2980B9","topic":"L11402","term":"影像轉文字","english":"Image-to-Text","abbr":"I2T","definition":"將影像內容轉換為文字描述、標籤、摘要或回答的跨模態任務。","plain":"AI 看圖後說明圖裡有什麼，或回答和圖片有關的問題。","exam":"Image-to-Text 可結合視覺辨識與語言生成；OCR 主要擷取圖中文字，兩者範圍不同。","number":"E-54"},
  {"code":"E","section":"鑑別式與生成式 AI 整合應用","color":"#2980B9","topic":"L11402","term":"合成資料","english":"Synthetic Data","abbr":"","definition":"由規則、模擬器或生成式模型人工產生，用來模擬真實資料特性與情境的資料。","plain":"不直接使用真實個案，而是製造相似的練習資料。","exam":"Synthetic Data 可補足稀少情境或降低直接使用個資，但仍可能保留偏誤、失真或隱私洩漏風險。","number":"E-55"},
  {"code":"E","section":"鑑別式與生成式 AI 整合應用","color":"#2980B9","topic":"L11402","term":"資料增強","english":"Data Augmentation","abbr":"","definition":"對既有訓練資料進行旋轉、裁切、改寫、加噪或生成變體，以增加資料多樣性並提升模型泛化能力。","plain":"把原本的題目做合理變化，讓模型看到更多練習情況。","exam":"Data Augmentation 以合理變換擴充既有資料；Synthetic Data 可從頭生成新樣本，兩者相關但不完全相同。","number":"E-56"},
  {"code":"E","section":"鑑別式與生成式 AI 整合應用","color":"#2980B9","topic":"L11402","term":"生成與鑑別整合流程","english":"Generation–Discrimination Pipeline","abbr":"","definition":"先由生成式模型產生、改寫或擴充候選內容，再由鑑別式模型進行分類、排序、過濾或品質檢核的組合流程。","plain":"一個 AI 先出作品，另一個 AI 再當審查員挑選或把關。","exam":"整合應用可發揮生成式 AI 的創造力與鑑別式 AI 的判斷力，但高風險結果仍需人工監督與驗證。","number":"E-57"},
  {"code":"E","section":"鑑別式與生成式 AI 整合應用","color":"#2980B9","topic":"L11402","term":"內容審核","english":"Content Moderation","abbr":"","definition":"利用規則、鑑別模型與人工審查，偵測並處理有害、違規、不當或不符合政策的輸入與輸出。","plain":"AI 產生內容前後都要檢查，必要時交由人員判斷。","exam":"Content Moderation 是風險控制，不保證零漏判；應搭配政策、閾值、申訴、日誌與 Human Oversight。","number":"E-58"}
];
DATA.terms.push(...L114_TERMS);
const L114_EXISTING_TOPICS={
  "鑑別式 AI":"L11401","生成式 AI":"L11401",
  "基礎模型":"L11401","大型語言模型":"L11401",
  "多模態":"L11402","多模態人工智慧":"L11402"
};
DATA.terms.forEach(t=>{if(L114_EXISTING_TOPICS[t.term])t.topic=L114_EXISTING_TOPICS[t.term]});
const TERM_DEDUP=new Map();
DATA.terms.forEach(t=>TERM_DEDUP.set(t.term,t));
DATA.terms=[...TERM_DEDUP.values()];
let visible=[...DATA.terms], index=0, section="ALL", direction="next", busy=false;
const $=s=>document.querySelector(s), book=$("#book"), toc=$("#toc");
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
const TOPICS={
  L11101:"AI 的定義與分類",L11102:"AI 治理概念",
  L11201:"資料基本概念與來源",L11202:"資料整理與分析流程",L11203:"資料隱私與安全",L11204:"國際個資保護與跨境傳輸",
  L11301:"機器學習基本原理",L11302:"常見的機器學習模型",
  L11401:"鑑別式 AI 與生成式 AI 的基本原理",L11402:"鑑別式 AI 與生成式 AI 的整合應用",
  L12101:"No Code／Low Code 的基本概念",L12102:"No Code／Low Code 的優勢與限制",
  L12201:"生成式 AI 應用領域與常見工具",L12202:"如何善用生成式 AI 工具",
  L12301:"生成式 AI 導入評估",L12302:"生成式 AI 導入規劃",L12303:"生成式 AI 風險管理"
};
function topicFor(t){
  const n=t.number, term=t.term;
  if(n.startsWith("A-")) return n==="A-06" ? "L11101" : "L11101";
  if(n.startsWith("B-")) return Number(n.slice(2))<=5 ? "L11201" : "L11202";
  if(n.startsWith("C-")) return Number(n.slice(2))<=8 ? "L11301" : "L11302";
  if(n.startsWith("D-")) return "L11302";
  if(n.startsWith("E-")) return ["多模態人工智慧","鑑別式 AI","生成式 AI"].includes(term) ? "L11402" : "L11401";
  if(n.startsWith("F-")) return ["提示工程","零樣本提示","少樣本提示","思維鏈提示","檢索增強生成","嵌入向量","向量資料庫","微調","上下文視窗","詞元化","溫度參數","人在迴路三模式"].includes(term) ? "L12202" : "L12201";
  if(n.startsWith("G-")){
    if(["無程式碼","低程式碼","工作流程","Webhook","機器人流程自動化","概念驗證","最小可行產品","總持有成本","高度耦合","單一登入"].includes(term)) return "L12101";
    if(["暫時替代方案","技術債","出口條款"].includes(term)) return "L12102";
    if(["原型","使用案例","投資報酬率","買或自建"].includes(term)) return "L12301";
    return "L12302";
  }
  if(n.startsWith("H-")) return ["偏誤","可解釋性","人在迴路","自動化偏誤"].includes(term) ? "L11102" : "L12303";
  return "L11101";
}
const COURSE_ORDER=["L111","L112","L113","L114","L121","L122","L123"];
const originalOrder=new Map(DATA.terms.map((t,i)=>[t,i]));
DATA.terms.forEach(t=>t.topic=t.topic||topicFor(t));
DATA.terms.sort((a,b)=>{
  const mainA=a.topic.slice(0,4),mainB=b.topic.slice(0,4);
  return COURSE_ORDER.indexOf(mainA)-COURSE_ORDER.indexOf(mainB)
    || a.topic.localeCompare(b.topic,"zh-Hant",{numeric:true})
    || originalOrder.get(a)-originalOrder.get(b);
});
visible=[...DATA.terms];
const COURSE_FILTERS=COURSE_ORDER.map(code=>({
  code,
  name:{
    L111:"人工智慧基礎概論",
    L112:"資料處理與分析概論",
    L113:"機器學習與深度學習",
    L114:"鑑別式與生成式 AI",
    L121:"No Code／Low Code",
    L122:"生成式 AI 工具與應用",
    L123:"生成式 AI 導入與風險"
  }[code]
}));
function render(){
  const t=visible[index];
  if(!t){book.innerHTML='<div class="empty">找不到符合的術語<br><small>請更換關鍵字或按「全部」</small></div>';$("#count").textContent="0 / 0";$("#bar").style.width="0";return}
  const topic=t.topic||topicFor(t), density=(t.definition+t.plain+t.exam).length>105?" compact":"";
  document.documentElement.style.setProperty("--accent",t.color);
  book.className="book"+density;
  book.innerHTML=`<section class="page left"><div class="kicker">${esc(t.section)}</div><div class="term-no">${t.number}</div><h1>${esc(t.term)}</h1><div class="english">${esc(t.english)}</div>${t.abbr?`<div class="abbr">${esc(t.abbr)}</div>`:""}<div class="topic-note">所屬主題｜<b>${topic}　${esc(TOPICS[topic])}</b></div></section><section class="page right"><div class="block"><div class="label">正式定義</div><p class="content">${esc(t.definition)}</p></div><div class="block"><div class="label">白話解釋</div><p class="content plain">${esc(t.plain)}</p></div><div class="block"><div class="label">考試重點</div><p class="content exam">${esc(t.exam)}</p></div></section>`;
  $("#count").textContent=`${index+1} / ${visible.length}`;$("#bar").style.width=`${(index+1)/visible.length*100}%`;
  $("#prev").disabled=index===0;$("#next").disabled=index===visible.length-1;
  [...toc.children].forEach((b,i)=>b.classList.toggle("active",i===index));
  try{localStorage.setItem("ipas-term-index",String(DATA.terms.indexOf(t)))}catch{}
}
function move(delta){
  const n=Math.max(0,Math.min(visible.length-1,index+delta));
  if(n===index||busy)return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){direction=delta>0?"next":"prev";index=n;render();return}
  busy=true;
  const stage=document.querySelector(".stage"),stageBox=stage.getBoundingClientRect(),bookBox=book.getBoundingClientRect();
  const turning=book.cloneNode(true),right=delta>0;
  turning.removeAttribute("id");
  turning.querySelectorAll("[id]").forEach(el=>el.removeAttribute("id"));
  turning.className=book.className+" turning-book";
  Object.assign(turning.style,{
    left:(bookBox.left-stageBox.left)+"px",top:(bookBox.top-stageBox.top)+"px",
    width:bookBox.width+"px",height:bookBox.height+"px",
    transformOrigin:right?"right center":"left center",
    transform:"translateX(0) rotateY(0deg)",filter:"brightness(1) drop-shadow(0 24px 30px #38285b2b)"
  });
  stage.appendChild(turning);
  direction=right?"next":"prev";index=n;render();
  let frame=0;const frames=28;
  const motion=setInterval(()=>{
    frame+=1;
    const t=frame/frames,ease=1-Math.pow(1-t,3);
    const x=(right?1:-1)*108*ease,angle=(right?-1:1)*118*ease;
    turning.style.transform=`translateX(${x}%) rotateY(${angle}deg)`;
    turning.style.filter=`brightness(${1-.38*ease}) drop-shadow(0 24px 30px #38285b2b)`;
    if(frame>=frames)clearInterval(motion);
  },30);
  setTimeout(()=>{clearInterval(motion);turning.remove();busy=false},870);
}
function apply(){
  const q=$("#search").value.trim().toLowerCase();
  visible=DATA.terms.filter(t=>(section==="ALL"||t.topic.startsWith(section))&&(!q||[t.topic,TOPICS[t.topic],t.term,t.english,t.abbr,t.definition,t.plain].join(" ").toLowerCase().includes(q)));
  index=0;buildToc();render();
}
function buildFilters(){
  $("#filters").innerHTML=[{code:"ALL",name:"全部"},...COURSE_FILTERS].map(s=>`<button class="chip ${s.code===section?"active":""}" data-code="${s.code}">${s.code==="ALL"?"全部":s.code+" "+esc(s.name)}</button>`).join("");
  $("#filters").onclick=e=>{const b=e.target.closest("button");if(!b)return;section=b.dataset.code;buildFilters();apply()}
}
function buildToc(){toc.innerHTML=visible.map((t,i)=>`<button data-i="${i}"><b>${t.topic}</b>　${esc(t.term)}<br><small>${esc(TOPICS[t.topic])} · ${esc(t.english)}${t.abbr?" · "+esc(t.abbr):""}</small></button>`).join("");toc.onclick=e=>{const b=e.target.closest("button");if(!b)return;index=+b.dataset.i;closeDrawer();render()}}
function openDrawer(){$("#drawer").classList.add("open");$("#overlay").classList.add("show")}function closeDrawer(){$("#drawer").classList.remove("open");$("#overlay").classList.remove("show")}
$("#prev").onclick=()=>move(-1);$("#next").onclick=()=>move(1);$("#menu").onclick=openDrawer;$("#close").onclick=closeDrawer;$("#overlay").onclick=closeDrawer;
$("#search").addEventListener("input",apply);$("#reset").onclick=()=>{$("#search").value="";section="ALL";buildFilters();apply()};
document.addEventListener("keydown",e=>{if(e.target.matches("input"))return;if(e.key==="ArrowRight"||e.key==="PageDown")move(1);if(e.key==="ArrowLeft"||e.key==="PageUp")move(-1);if(e.key==="Escape")closeDrawer()});
let x=0;book.addEventListener("touchstart",e=>x=e.touches[0].clientX,{passive:true});book.addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-x;if(Math.abs(d)>55)move(d<0?1:-1)},{passive:true});
try{index=Math.max(0,Math.min(DATA.terms.length-1,Number(localStorage.getItem("ipas-term-index")||0)))}catch{}
buildFilters();buildToc();render();
</script>
